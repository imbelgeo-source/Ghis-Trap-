<script>
function calculer() {
  const B = parseFloat(document.getElementById("B").value);
  const b = parseFloat(document.getElementById("b").value);
  const T = parseFloat(document.getElementById("T").value);
  const t = parseFloat(document.getElementById("t").value);
  const L = parseFloat(document.getElementById("L").value);

  const result = document.getElementById("result");

  if (![B,b,T,t,L].every(Number.isFinite) ||
      B <= b || b <= 0 || T <= t || t <= 0 || L <= 0) {
    result.innerHTML = "Vérifiez les dimensions saisies.";
    return;
  }

  const h = Math.sqrt(T*T - t*t);
  const W = b + ((T-t)*(B-b))/T;
  const S = ((b+W)*h)/2;
  const V = S*L;

  result.innerHTML = `
    <h3>Résultats GHIS-TRAP</h3>
    Hauteur du ghis : ${h.toFixed(3)} m<br>
    Largeur supérieure : ${W.toFixed(3)} m<br>
    Section du ghis : ${S.toFixed(3)} m²<br>
    <h2>Volume : ${V.toFixed(2)} m³</h2>
  `;
}
</script>
